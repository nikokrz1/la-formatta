<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Formatta Pizzaria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f5f4ee; --bg-raised: #ffffff; --ink: #23271f; --ink-soft: #5b6157;
    --border: #dedad0; --accent: #2c6b5e; --accent-soft: #e3efe9; --accent-ink: #0f3a30;
    --shadow: 0 1px 2px rgba(35,39,31,0.06), 0 4px 14px rgba(35,39,31,0.05);
    --topbar: 52px; --bottombar: 62px; --sidebar: 220px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d19; --bg-raised: #24261f; --ink: #ece9e0; --ink-soft: #a5a99c;
      --border: #383b32; --accent: #6cc4ac; --accent-soft: #23342d; --accent-ink: #a9e6d1;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Work Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; overflow: hidden; }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; margin: 0; text-wrap: balance; }

  .app { height: 100%; height: 100dvh; display: grid; grid-template-rows: var(--topbar) 1fr var(--bottombar); grid-template-columns: 1fr; }

  /* topo */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .brand { display: flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; font: inherit; color: var(--accent-ink); cursor: pointer; }
  .brand span.logo { font-size: 22px; line-height: 1; }
  .brand h1 { font-size: 18px; font-weight: 600; }
  .btn-sair { font: inherit; font-size: 12.5px; font-weight: 600; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--ink-soft); cursor: pointer; }

  /* área de conteúdo */
  .stage { position: relative; min-height: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); display: none; }
  .stage iframe.on { display: block; }
  .home { position: absolute; inset: 0; overflow-y: auto; padding: 18px 14px 24px; display: none; }
  .home.on { display: block; }
  .home .inner { max-width: 760px; margin: 0 auto; }
  .home h2 { font-size: 20px; color: var(--accent-ink); margin-bottom: 4px; }
  .home p.sub { margin: 0 0 16px; color: var(--ink-soft); font-size: 13.5px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { display: flex; flex-direction: column; gap: 4px; text-align: left; text-decoration: none; color: inherit; font: inherit; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px; box-shadow: var(--shadow); cursor: pointer; }
  .card .ico { font-size: 26px; line-height: 1; }
  .card .t { font-weight: 700; font-size: 15px; margin-top: 6px; color: var(--accent-ink); }
  .card .d { font-size: 12.5px; color: var(--ink-soft); }
  .card:active { background: var(--accent-soft); }

  /* navegação */
  nav.menu { display: flex; background: var(--bg-raised); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  nav.menu a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--ink-soft); font-size: 10.5px; font-weight: 600; padding: 6px 2px; min-width: 0; }
  nav.menu a .ico { font-size: 20px; line-height: 1; }
  nav.menu a.on { color: var(--accent-ink); background: var(--accent-soft); }
  nav.menu a .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav.menu a.sidebar-only { display: none; }

  /* desktop: menu lateral */
  @media (min-width: 900px) {
    .app { grid-template-columns: var(--sidebar) 1fr; grid-template-rows: var(--topbar) 1fr; }
    .topbar { grid-column: 1 / -1; }
    nav.menu { grid-row: 2; grid-column: 1; flex-direction: column; border-top: none; border-right: 1px solid var(--border); padding: 10px 8px; gap: 4px; flex: none; justify-content: flex-start; }
    nav.menu a { flex: none; flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 14px; padding: 10px 12px; border-radius: 10px; }
    nav.menu a .ico { font-size: 18px; }
    nav.menu a.sidebar-only { display: flex; }
    .stage { grid-row: 2; grid-column: 2; }
    .cards { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="Início"><span class="logo">🍕</span><h1>La Formatta Pizzaria</h1></button>
    <button class="btn-sair" id="btnSair" type="button">Sair</button>
  </header>

  <main class="stage" id="stage">
    <section class="home on" id="home">
      <div class="inner">
        <h2>O que você quer abrir?</h2>
        <p class="sub">Escolha um módulo abaixo ou no menu.</p>
        <div class="cards" id="cards"></div>
      </div>
    </section>
  </main>

  <nav class="menu" id="menu" aria-label="Módulos"></nav>
</div>

<script src="auth.js"></script>
<script>
// Cada módulo abre a página que já existe, sem alteração de conteúdo ou de funcionamento.
// "embed=1" só esconde o título repetido dentro do portal.
var METABASE = 'https://metabase-production-60c4.up.railway.app';
var MODULES = [
  { id: 'lancamentos',label: 'Lançamentos', ico: '🧾', desc: 'Notas, funcionários e histórico',          src: 'despesas.html?embed=1' },
  { id: 'checklist',  label: 'Checklist',   ico: '✅', desc: 'Itens fixos do mês (aluguel, FGTS…)',      src: 'despesas.html?embed=1&tab=checklist' },
  { id: 'insumos',    label: 'Insumos',     ico: '🏷️', desc: 'Preços de compra e fornecedores',          src: 'precos.html?embed=1' },
  { id: 'dashboard',  label: 'Dashboard',   ico: '📊', desc: 'Visão Geral no Metabase (abre em outra aba)', href: METABASE + '/dashboard/2' }
];

var $ = function (s, el) { return (el || document).querySelector(s); };
var frames = {};
var ready = false;

function buildMenu() {
  var menu = $('#menu'), cards = $('#cards');
  var items = [{ id: 'home', label: 'Início', ico: '🏠', sidebarOnly: true }].concat(MODULES);
  menu.innerHTML = items.map(function (m) {
    var cls = m.sidebarOnly ? ' class="sidebar-only"' : '';
    if (m.href) return '<a href="' + m.href + '" target="_blank" rel="noopener" data-id="' + m.id + '"' + cls + '><span class="ico">' + m.ico + '</span><span class="lbl">' + m.label + ' ↗</span></a>';
    return '<a href="#' + m.id + '" data-id="' + m.id + '"' + cls + '><span class="ico">' + m.ico + '</span><span class="lbl">' + m.label + '</span></a>';
  }).join('');
  cards.innerHTML = MODULES.map(function (m) {
    var inner = '<span class="ico">' + m.ico + '</span><span class="t">' + m.label + (m.href ? ' ↗' : '') + '</span><span class="d">' + m.desc + '</span>';
    return m.href
      ? '<a class="card" href="' + m.href + '" target="_blank" rel="noopener">' + inner + '</a>'
      : '<a class="card" href="#' + m.id + '">' + inner + '</a>';
  }).join('');
}

function show(id) {
  var mod = MODULES.filter(function (m) { return m.id === id && m.src; })[0];
  var home = $('#home');
  Object.keys(frames).forEach(function (k) { frames[k].classList.remove('on'); });
  if (!mod) {
    home.classList.add('on');
    id = 'home';
  } else {
    home.classList.remove('on');
    if (!frames[mod.id]) {
      var f = document.createElement('iframe');
      f.title = mod.label;
      f.src = mod.src;
      $('#stage').appendChild(f);
      frames[mod.id] = f;
    }
    frames[mod.id].classList.add('on');
  }
  Array.prototype.forEach.call(document.querySelectorAll('#menu a'), function (a) {
    a.classList.toggle('on', a.dataset.id === id);
  });
}

function route() {
  if (!ready) return;
  show((location.hash || '').replace('#', ''));
}

$('#brand').addEventListener('click', function () { location.hash = ''; show('home'); });
$('#btnSair').addEventListener('click', function () {
  try { localStorage.removeItem('lbd_session'); } catch (e) {}
  location.reload();
});
window.addEventListener('hashchange', route);

buildMenu();
// Login uma única vez: só depois de autenticar os módulos são carregados (a sessão é compartilhada entre as páginas).
lbdAuth.ensure().then(function () { ready = true; route(); });
</script>
</body>
</html>
